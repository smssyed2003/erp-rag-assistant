<div class="chat-shell">
  <div class="chat-container">
    <div class="chat-header">
      <div>
        <h1>ERP AI Agent</h1>
        <p>Ask your ERP question and watch the agent reason step-by-step.</p>
      </div>
      <div class="status-chip">AI Agent Online</div>
    </div>

    <div class="chat-box" #chatBox>
    <div *ngFor="let msg of messages" class="message-wrapper" [ngClass]="msg.role">

      <div class="message-bubble" [class.bot-bubble]="msg.role === 'bot'" [class.user-bubble]="msg.role === 'user'">
        <div class="message-text">
          {{ msg.text || (msg.isTyping ? 'Thinking...' : '') }}
        </div>

        <div class="source-tags" *ngIf="msg.sources?.length">
          <span class="source-chip" *ngFor="let source of msg.sources">{{ source }}</span>
        </div>

        <div class="agent-steps" *ngIf="msg.steps?.length">
          <button class="steps-toggle" (click)="toggleSteps(msg)">
            Agent steps ({{ msg.steps.length }})
            <span>{{ msg.expandSteps ? '▲' : '▼' }}</span>
          </button>
          <div class="step-list" *ngIf="msg.expandSteps">
            <div *ngFor="let step of msg.steps" class="step-item">
              <strong>{{ step.action }}</strong>: {{ step.description }}
            </div>
          </div>
        </div>
      </div>

    </div>

      <div *ngIf="isLoading" class="typing-indicator">
        <span></span><span></span><span></span>
        <span>Thinking...</span>
      </div>

    </div>

    <div class="chat-input">
      <input
        [(ngModel)]="userInput"
        placeholder="Ask something about ERP..."
        (keyup.enter)="sendMessage()"
      />
      <button (click)="sendMessage()">Send</button>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>
  </div>
</div>
